services:
  # ── API Server ──────────────────────────────────────────────────────────────
  - type: web
    name: balaagh-api
    runtime: node
    region: frankfurt
    plan: free
    rootDir: Platform
    buildCommand: npm install -g pnpm@10 && pnpm install --frozen-lockfile && pnpm --filter @workspace/api-server run build
    startCommand: node --enable-source-maps artifacts/api-server/dist/index.mjs
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "10000"

  # ── Frontend (Static Site) ──────────────────────────────────────────────────
  - type: web
    name: balaagh-frontend
    runtime: static
    plan: free
    rootDir: Platform
    buildCommand: npm install -g pnpm@10 && pnpm install --frozen-lockfile && VITE_BASE_PATH=/ VITE_API_BASE_URL=https://balaagh-api.onrender.com pnpm --filter @workspace/balaagh-ai run build
    staticPublishPath: artifacts/balaagh-ai/dist/public
    routes:
      - type: rewrite
        source: /api/*
        destination: https://balaagh-api.onrender.com/api/*
      - type: rewrite
        source: /*
        destination: /index.html
