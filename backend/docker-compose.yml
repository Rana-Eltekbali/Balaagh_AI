services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: balaagh
      POSTGRES_USER: balaagh
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U balaagh -d balaagh"]
      interval: 5s
      timeout: 5s
      retries: 12

  api:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://balaagh:${POSTGRES_PASSWORD}@db:5432/balaagh
      DATABASE_SSL: "false"
      CATEGORY_MODEL_PATH: /models/category
      PRIORITY_MODEL_PATH: /models/category
      LOCATION_MODEL_PATH: /models/location
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ${CATEGORY_MODEL_DIR:?Set CATEGORY_MODEL_DIR}:/models/category:ro
      - ${LOCATION_MODEL_DIR:?Set LOCATION_MODEL_DIR}:/models/location:ro
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
