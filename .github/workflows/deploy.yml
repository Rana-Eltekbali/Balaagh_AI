name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12

      - name: Validate public API origin
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
        run: |
          node --input-type=module <<'NODE'
          const value = process.env.VITE_API_BASE_URL;
          let url;
          try { url = new URL(value); } catch {
            throw new Error('Set the repository Actions variable VITE_API_BASE_URL to the public HTTPS backend origin.');
          }
          if (url.protocol !== 'https:' || url.username || url.password ||
              url.pathname !== '/' || url.search || url.hash ||
              ['localhost', '127.0.0.1', '[::1]'].includes(url.hostname)) {
            throw new Error('VITE_API_BASE_URL must be a public HTTPS origin without /api, credentials, query, or fragment.');
          }
          NODE

      - name: Install dependencies
        working-directory: Platform
        run: pnpm install --frozen-lockfile

      - name: Generate API client
        working-directory: Platform
        run: pnpm --filter @workspace/api-spec run codegen

      - name: Type check
        working-directory: Platform
        run: pnpm run typecheck

      - name: Build dashboard
        working-directory: Platform/artifacts/balaagh-ai
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
        run: pnpm run build:pages

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: Platform/artifacts/balaagh-ai/dist/public
          publish_branch: gh-pages
