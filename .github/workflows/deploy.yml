name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12

      - name: Install dependencies
        working-directory: Platform
        run: pnpm install --frozen-lockfile

      - name: Generate API client
        working-directory: Platform
        run: pnpm --filter @workspace/api-spec run codegen

      - name: Type check
        working-directory: Platform
        run: pnpm run typecheck

      - name: Build dashboard
        working-directory: Platform/artifacts/balaagh-ai
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
        run: pnpm run build

      - name: Add SPA fallback
        shell: bash
        run: |
          cp \
            Platform/artifacts/balaagh-ai/dist/public/index.html \
            Platform/artifacts/balaagh-ai/dist/public/404.html

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: Platform/artifacts/balaagh-ai/dist/public
          publish_branch: gh-pages