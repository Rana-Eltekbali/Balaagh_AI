name: Backend verification
on:
  push:
    paths: ["backend/**", "Platform/lib/api-spec/**", ".github/workflows/backend.yml"]
  pull_request:
    paths: ["backend/**", "Platform/lib/api-spec/**", ".github/workflows/backend.yml"]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: balaagh_test
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test_only_ephemeral
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U test -d balaagh_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: "backend/requirements*.txt"
      - run: python -m pip install -r requirements-dev.txt
      - run: ruff check app tests scripts migrations
      - run: ruff format --check app tests scripts migrations
      - run: pytest -q
        env:
          TEST_DATABASE_URL: postgresql+asyncpg://test:test_only_ephemeral@localhost:5432/balaagh_test
