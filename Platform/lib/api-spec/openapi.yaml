openapi: 3.1.0
info:
  title: Api
  version: 1.0.0
  description: Balaagh AI trained-model analysis and persistent report API
servers:
- url: /api
  description: Base API path
security:
- DemoBearer: []
tags:
- name: health
  description: Health operations
- name: reports
  description: Crisis report analysis and management
- name: dashboard
  description: Dashboard summaries
- name: analytics
  description: Analytics and model evaluation
paths:
  /healthz:
    get:
      security: []
      operationId: healthCheck
      tags:
      - health
      summary: Health check
      description: Returns server health status
      responses:
        '200':
          description: Healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'
        default:
          description: Validation, not-found, or service error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /reports:
    get:
      operationId: listReports
      tags:
      - reports
      summary: List analyzed crisis reports
      parameters:
      - $ref: '#/components/parameters/Search'
      - $ref: '#/components/parameters/IncidentClass'
      - $ref: '#/components/parameters/Priority'
      - $ref: '#/components/parameters/Location'
      - $ref: '#/components/parameters/Sort'
      responses:
        '200':
          description: Matching reports
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Report'
        default:
          description: Validation, not-found, or service error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
    post:
      operationId: createReport
      tags:
      - reports
      summary: Save an analyzed report
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReportInput'
      responses:
        '201':
          description: Saved report
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Report'
        default:
          description: Validation, not-found, or service error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /reports/analyze:
    post:
      operationId: analyzeReport
      tags:
      - reports
      summary: Analyze Arabic text with trained category, priority and location models
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AnalysisInput'
      responses:
        '200':
          description: Structured analysis
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalysisResult'
        default:
          description: Validation, not-found, or service error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /reports/{id}:
    get:
      operationId: getReport
      tags:
      - reports
      summary: Get one analyzed report
      parameters:
      - $ref: '#/components/parameters/ReportId'
      responses:
        '200':
          description: Report details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Report'
        '404':
          description: Report not found
        default:
          description: Validation, not-found, or service error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
    patch:
      operationId: updateReport
      tags:
      - reports
      summary: Update a saved report's fields
      parameters:
      - $ref: '#/components/parameters/ReportId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReportUpdate'
      responses:
        '200':
          description: Updated report
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Report'
        '404':
          description: Report not found
        default:
          description: Validation, not-found, or service error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
    delete:
      operationId: deleteReport
      tags:
      - reports
      summary: Delete a saved report
      parameters:
      - $ref: '#/components/parameters/ReportId'
      responses:
        '204':
          description: Report deleted
        default:
          description: Validation, not-found, or service error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /dashboard/summary:
    get:
      operationId: getDashboardSummary
      tags:
      - dashboard
      summary: Get dashboard statistics and recent reports
      parameters:
      - name: filter
        in: query
        required: false
        schema:
          type: string
          enum: [today, all]
          default: today
        description: Filter reports by today or all time
      responses:
        '200':
          description: Dashboard summary
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardSummary'
        default:
          description: Validation, not-found, or service error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /locations/summary:
    get:
      operationId: getLocationsSummary
      tags:
      - analytics
      summary: Get location reporting summaries
      responses:
        '200':
          description: Location summary
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LocationsSummary'
        default:
          description: Validation, not-found, or service error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /analytics/summary:
    get:
      operationId: getAnalyticsSummary
      tags:
      - analytics
      summary: Get saved-report aggregations and optional genuine evaluation
      parameters:
      - $ref: '#/components/parameters/IncidentClass'
      - $ref: '#/components/parameters/Priority'
      - name: location
        in: query
        required: false
        schema:
          type: string
          maxLength: 5000
      - name: peopleAtRisk
        in: query
        required: false
        schema:
          type: string
          enum: ['true', 'false']
      - name: dateFrom
        in: query
        required: false
        description: Inclusive YYYY-MM-DD creation date in REPORTS_TIMEZONE. Omit for no lower bound.
        schema:
          type: string
          pattern: '^\d{4}-\d{2}-\d{2}$'
      - name: dateTo
        in: query
        required: false
        description: Inclusive YYYY-MM-DD creation date in REPORTS_TIMEZONE; must be on or after dateFrom. Omit for no upper bound.
        schema:
          type: string
          pattern: '^\d{4}-\d{2}-\d{2}$'
      responses:
        '200':
          description: Analytics summary
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalyticsSummary'
        default:
          description: Validation, not-found, or service error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /reports/edits:
    get:
      operationId: listReportEdits
      tags:
      - reports
      summary: List analyst field corrections, newest first
      responses:
        '200':
          description: Field correction history
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ReportEdit'
        default:
          description: Validation, not-found, or service error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
components:
  securitySchemes:
    DemoBearer:
      type: http
      scheme: bearer
      description: Shared demo access key supplied privately at runtime. Never embed in frontend builds.
  parameters:
    ReportId:
      name: id
      in: path
      required: true
      schema:
        type: integer
    Search:
      name: search
      in: query
      required: false
      schema:
        type: string
    IncidentClass:
      name: incidentClass
      in: query
      required: false
      schema:
        $ref: '#/components/schemas/IncidentClass'
    Priority:
      name: priority
      in: query
      required: false
      schema:
        $ref: '#/components/schemas/Priority'
    Location:
      name: location
      in: query
      required: false
      schema:
        type: string
    Sort:
      name: sort
      in: query
      required: false
      schema:
        type: string
        enum:
        - date
        - priority
        - incidentClass
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
        database:
          type: string
        modelsLoaded:
          type: boolean
        llmEnabled:
          type: boolean
      required:
      - status
    IncidentClass:
      type: string
      enum:
      - Fire / Explosion
      - Flood / Severe Weather
      - Infrastructure / Utilities
      - Road / Transportation
      - People at Risk / Medical
      - Other
    Priority:
      type: string
      enum:
      - Low
      - Medium
      - High
      - Critical
    Report:
      type: object
      required:
      - id
      - originalText
      - incidentClass
      - priority
      - location
      - peopleAtRisk
      - requiredSupport
      - summary
      - createdAt
      - analysisTime
      - updatedAt
      properties:
        id:
          type: integer
        originalText:
          type: string
        incidentClass:
          $ref: '#/components/schemas/IncidentClass'
        priority:
          $ref: '#/components/schemas/Priority'
        location:
          type: string
          maxLength: 5000
        peopleAtRisk:
          type: boolean
        requiredSupport:
          type: string
          maxLength: 500
        summary:
          type: string
          maxLength: 5000
        createdAt:
          type: string
        analysisTime:
          type: string
        updatedAt:
          type: string
          description: UTC ISO-8601 last-update timestamp
    ReportInput:
      type: object
      required:
      - originalText
      - incidentClass
      - priority
      - location
      - peopleAtRisk
      - requiredSupport
      - summary
      properties:
        originalText:
          type: string
          minLength: 5
          maxLength: 5000
        incidentClass:
          $ref: '#/components/schemas/IncidentClass'
        priority:
          $ref: '#/components/schemas/Priority'
        location:
          type: string
          maxLength: 5000
        peopleAtRisk:
          type: boolean
        requiredSupport:
          type: string
          maxLength: 500
        summary:
          type: string
          maxLength: 5000
        analysisToken:
          type:
          - string
          - 'null'
          maxLength: 200000
          description: Optional signed model metadata receipt; preserve unchanged
            between analysis and save.
      additionalProperties: false
    ReportUpdate:
      type: object
      properties:
        incidentClass:
          $ref: '#/components/schemas/IncidentClass'
        priority:
          $ref: '#/components/schemas/Priority'
        location:
          type: string
          maxLength: 5000
        peopleAtRisk:
          type: boolean
        requiredSupport:
          type: string
          maxLength: 500
        summary:
          type: string
          maxLength: 5000
      additionalProperties: false
    AnalysisInput:
      type: object
      required:
      - text
      properties:
        text:
          type: string
          minLength: 5
          maxLength: 5000
      additionalProperties: false
    AnalysisResult:
      type: object
      required:
      - incidentClass
      - priority
      - location
      - peopleAtRisk
      - requiredSupport
      - summary
      properties:
        incidentClass:
          $ref: '#/components/schemas/IncidentClass'
        priority:
          $ref: '#/components/schemas/Priority'
        location:
          type: string
          maxLength: 5000
        peopleAtRisk:
          type: boolean
        requiredSupport:
          type: string
          maxLength: 500
        summary:
          type: string
          maxLength: 5000
        analysisToken:
          type:
          - string
          - 'null'
          maxLength: 200000
          description: Optional signed model metadata receipt; preserve unchanged
            between analysis and save.
    DashboardSummary:
      type: object
      required:
      - totalReports
      - criticalReports
      - highPriority
      - reportsToday
      - recentReports
      - byIncidentClass
      - byPriority
      - byLocation
      properties:
        totalReports:
          type: integer
        criticalReports:
          type: integer
        highPriority:
          type: integer
        reportsToday:
          type: integer
        recentReports:
          type: array
          items:
            $ref: '#/components/schemas/Report'
        byIncidentClass:
          type: array
          items:
            $ref: '#/components/schemas/CountItem'
        byPriority:
          type: array
          items:
            $ref: '#/components/schemas/CountItem'
        byLocation:
          type: array
          items:
            $ref: '#/components/schemas/CountItem'
    LocationsSummary:
      type: object
      required:
      - locations
      properties:
        locations:
          type: array
          items:
            $ref: '#/components/schemas/LocationSummary'
    LocationSummary:
      type: object
      required:
      - location
      - reports
      - criticalReports
      - peopleAtRisk
      properties:
        location:
          type: string
        reports:
          type: integer
        criticalReports:
          type: integer
        peopleAtRisk:
          type: integer
    AnalyticsSummary:
      type: object
      required:
      - byIncidentClass
      - byPriority
      - byLocation
      - bySupport
      - peopleAtRisk
      - totalFiltered
      - evaluation
      properties:
        byIncidentClass:
          type: array
          items:
            $ref: '#/components/schemas/CountItem'
        byPriority:
          type: array
          items:
            $ref: '#/components/schemas/CountItem'
        byLocation:
          type: array
          items:
            $ref: '#/components/schemas/CountItem'
        bySupport:
          type: array
          items:
            $ref: '#/components/schemas/CountItem'
        peopleAtRisk:
          type: integer
        totalFiltered:
          type: integer
          minimum: 0
          description: Number of reports matching all supplied filters; the full report count when filters are omitted.
        evaluation:
          anyOf:
          - $ref: '#/components/schemas/ModelEvaluation'
          - type: 'null'
    CountItem:
      type: object
      required:
      - label
      - count
      properties:
        label:
          type: string
        count:
          type: integer
    ModelEvaluation:
      type: object
      required:
      - accuracy
      - precision
      - recall
      - macroF1
      - confusionMatrix
      properties:
        accuracy:
          type: number
        precision:
          type: number
        recall:
          type: number
        macroF1:
          type: number
        confusionMatrix:
          type: array
          items:
            type: array
            items:
              type: integer
    ReportEdit:
      type: object
      required:
      - reportId
      - editedAt
      - field
      - before
      - after
      - originalText
      - incidentClass
      properties:
        reportId:
          type: integer
        editedAt:
          type: string
        field:
          type: string
        before:
          type: string
        after:
          type: string
        originalText:
          type: string
        incidentClass:
          $ref: '#/components/schemas/IncidentClass'
    ApiError:
      type: object
      required:
      - error
      properties:
        error:
          type: object
          required:
          - code
          - message
          - requestId
          properties:
            code:
              type: string
            message:
              type: string
            requestId:
              type: string
